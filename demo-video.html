<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DealGuard Demo Video Generator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #080705;
        --panel: #10100d;
        --ink: #fff7e8;
        --muted: #b8ac98;
        --amber: #ffab31;
        --cyan: #24d2ba;
        --green: #43dc8b;
        --red: #ff675f;
        --blue: #8095ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        gap: 16px;
        padding: 24px;
        background: radial-gradient(circle at 80% 15%, rgba(36, 210, 186, 0.22), transparent 34%),
          radial-gradient(circle at 0% 0%, rgba(255, 171, 49, 0.2), transparent 26%),
          var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      canvas {
        width: min(100%, 1280px);
        aspect-ratio: 16 / 9;
        border: 1px solid rgba(255, 171, 49, 0.28);
        border-radius: 10px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.45);
        background: #080705;
      }

      .controls {
        width: min(100%, 1280px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      button,
      a {
        border: 1px solid rgba(36, 210, 186, 0.45);
        border-radius: 8px;
        padding: 12px 16px;
        background: linear-gradient(180deg, #24d2ba, #087568);
        color: #04110f;
        font-weight: 900;
        text-decoration: none;
        cursor: pointer;
      }

      button.secondary {
        border-color: rgba(255, 171, 49, 0.45);
        background: rgba(255, 171, 49, 0.1);
        color: var(--ink);
      }

      p {
        margin: 0;
        color: var(--muted);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" width="1920" height="1080"></canvas>
    <div class="controls">
      <p id="status">Ready. Click record to create dealguard-demo.webm.</p>
      <div>
        <button id="preview" class="secondary" type="button">Preview</button>
        <button id="record" type="button">Record WebM</button>
      </div>
    </div>

    <script>
      const canvas = document.querySelector("#stage");
      const ctx = canvas.getContext("2d");
      const statusEl = document.querySelector("#status");
      let duration = 78;
      const fps = 30;
      const voiceoverUrl = "./docs/dealguard-voiceover.wav";
      const liveDemoUrl = "https://dealguard-dun.vercel.app";
      const contractAddress = "0x200bBf7a3A0ce93E5d6126C7C8dD33f4914D129A";
      const deployTx = "0xbe4c164c9efd57bef9348918e5e03ec4c9f60da0ba8d676fd32de401";

      const scenes = [
        { start: 0, end: 8, kind: "title" },
        { start: 8, end: 19, kind: "riskHigh" },
        { start: 19, end: 31, kind: "riskLow" },
        { start: 31, end: 43, kind: "fund" },
        { start: 43, end: 56, kind: "resolve" },
        { start: 56, end: 67, kind: "proof" },
        { start: 67, end: 78, kind: "close" }
      ];

      function clamp(value, min = 0, max = 1) {
        return Math.max(min, Math.min(max, value));
      }

      function ease(value) {
        const x = clamp(value);
        return x * x * (3 - 2 * x);
      }

      function sceneAt(time) {
        return scenes.find((scene) => time >= scene.start && time < scene.end) || scenes.at(-1);
      }

      function sceneProgress(scene, time) {
        return ease((time - scene.start) / (scene.end - scene.start));
      }

      function clear() {
        const gradient = ctx.createLinearGradient(0, 0, 1920, 1080);
        gradient.addColorStop(0, "#100902");
        gradient.addColorStop(0.46, "#080705");
        gradient.addColorStop(1, "#002e29");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 1920, 1080);
        ctx.fillStyle = "rgba(255,171,49,0.12)";
        ctx.beginPath();
        ctx.arc(70, 20, 500, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(36,210,186,0.14)";
        ctx.beginPath();
        ctx.arc(1810, 150, 620, 0, Math.PI * 2);
        ctx.fill();
      }

      function text(value, x, y, size, color = "#fff7e8", weight = 900, align = "left") {
        ctx.save();
        ctx.font = `${weight} ${size}px Inter, Arial, sans-serif`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = "top";
        ctx.fillText(value, x, y);
        ctx.restore();
      }

      function wrap(value, x, y, maxWidth, lineHeight, size, color = "#b8ac98", weight = 700) {
        ctx.save();
        ctx.font = `${weight} ${size}px Inter, Arial, sans-serif`;
        ctx.fillStyle = color;
        ctx.textBaseline = "top";
        const words = value.split(" ");
        let line = "";
        let row = 0;
        for (const word of words) {
          const next = `${line} ${word}`.trim();
          if (ctx.measureText(next).width > maxWidth && line) {
            ctx.fillText(line, x, y + row * lineHeight);
            line = word;
            row += 1;
          } else {
            line = next;
          }
        }
        ctx.fillText(line, x, y + row * lineHeight);
        ctx.restore();
      }

      function panel(x, y, w, h, color = "rgba(10,10,8,0.74)", stroke = "rgba(255,171,49,0.22)") {
        ctx.save();
        ctx.fillStyle = color;
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 2;
        roundRect(x, y, w, h, 14);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function topBar() {
        panel(70, 48, 1780, 96, "rgba(12,13,10,0.86)", "rgba(36,210,186,0.24)");
        text("DealGuard", 104, 75, 44);
        pill("Live on Bradbury", 365, 80, 190, "#43dc8b", "rgba(67,220,139,0.12)");
        text("GenLayer", 1430, 68, 22, "#24d2ba", 900);
        text("Consensus backed verdict", 1430, 99, 27);
      }

      function pill(value, x, y, w, color, bg) {
        panel(x, y, w, 42, bg, color);
        text(value, x + w / 2, y + 11, 17, color, 900, "center");
      }

      function appShell() {
        topBar();
        panel(70, 170, 420, 820);
        panel(525, 170, 930, 820);
        panel(1490, 170, 360, 820);
      }

      function drawButton(label, x, y, w, color1, color2) {
        const g = ctx.createLinearGradient(x, y, x, y + 58);
        g.addColorStop(0, color1);
        g.addColorStop(1, color2);
        panel(x, y, w, 58, g, "rgba(255,255,255,0.12)");
        text(label, x + w / 2, y + 17, 22, "#050807", 950, "center");
      }

      function input(label, value, x, y, w, h = 58) {
        text(label.toUpperCase(), x, y - 28, 15, "#8f8475", 950);
        panel(x, y, w, h, "rgba(0,0,0,0.52)", "rgba(255,171,49,0.16)");
        wrap(value, x + 18, y + 16, w - 36, 32, 21, "#fff7e8", 760);
      }

      function score(value, label, color) {
        panel(1280, 245, 130, 130, "rgba(0,0,0,0.58)", color);
        text(String(value), 1345, 273, 52, color, 950, "center");
        text(label, 1345, 340, 16, "#b8ac98", 900, "center");
      }

      function metric(label, value, y) {
        panel(1520, y, 300, 84, "rgba(0,0,0,0.58)", "rgba(255,171,49,0.18)");
        text(label, 1540, y + 20, 21, "#b8ac98", 900);
        text(value, 1800, y + 20, 26, "#fff7e8", 950, "right");
      }

      function issue(label, detail, x, y, severity = "MEDIUM") {
        panel(x, y, 410, 112, "rgba(0,0,0,0.58)", severity === "HIGH" ? "#ff675f" : "#ffab31");
        text(label, x + 22, y + 22, 24);
        wrap(detail, x + 22, y + 58, 300, 24, 18);
        pill(severity, x + 300, y + 20, 86, severity === "HIGH" ? "#ff675f" : "#ffab31", "rgba(255,171,49,0.08)");
      }

      function sceneTitle(p) {
        clear();
        text("DealGuard", 120, 145, 96);
        text("Agent escrow risk desk", 126, 115, 26, "#ffab31", 950);
        wrap("A GenLayer powered escrow and dispute resolver for autonomous agents.", 126, 275, 900, 50, 38, "#fff7e8", 800);
        wrap("Audit the agreement before funding. Lock GEN in escrow only when terms are clear. Resolve payout with delivery evidence.", 126, 440, 900, 42, 28);
        panel(1160, 165, 560, 440, "rgba(0,0,0,0.42)", "rgba(36,210,186,0.34)");
        text("Live demo", 1210, 215, 28, "#24d2ba");
        text(liveDemoUrl, 1210, 275, 32);
        text("Bradbury contract", 1210, 370, 28, "#ffab31");
        wrap(contractAddress, 1210, 430, 460, 34, 24, "#fff7e8", 850);
        pill("Built for GenLayer Agent Tank", 126, 900, 390, "#24d2ba", "rgba(36,210,186,0.11)");
      }

      function sceneRiskHigh(p) {
        clear();
        appShell();
        text("1. Audit agreement risk before money moves", 555, 205, 34);
        input("Brief", "Client hires ResearchBot for high quality leads. Payment releases if the client is satisfied.", 105, 295, 350, 170);
        drawButton("Audit", 105, 890, 155, "#24d2ba", "#087568");
        panel(555, 260, 860, 160, "rgba(255,171,49,0.12)", "rgba(255,171,49,0.42)");
        text("Agreement risk", 585, 292, 21, "#ffab31", 950);
        text("Needs rewrite", 585, 330, 42);
        score(96, "risk", "#ffab31");
        issue("Ambiguous term", "High quality is not measurable.", 555, 500, "MEDIUM");
        issue("Buyer discretion", "Satisfied gives one side too much control.", 1010, 500, "HIGH");
        text("Do not fund", 1530, 260, 36, "#ff675f");
        wrap("DealGuard blocks escrow funding until the agreement has measurable acceptance rules.", 1530, 330, 260, 34, 24);
      }

      function sceneRiskLow(p) {
        clear();
        appShell();
        text("2. Rewrite terms into measurable rules", 555, 205, 34);
        input("Brief", "20 Turkish fintech leads by Sep 17. At least 18 must include role, LinkedIn, source URL, and valid email.", 105, 295, 350, 210);
        input("Escrow", "0.020 GEN", 105, 570, 160);
        input("Worker wallet", "0x3db9...84ef9", 105, 675, 350);
        panel(555, 260, 860, 160, "rgba(36,210,186,0.1)", "rgba(36,210,186,0.42)");
        text("Agreement risk", 585, 292, 21, "#24d2ba", 950);
        text("Ready for escrow", 585, 330, 42);
        score(12, "risk", "#24d2ba");
        issue("Quantity", "20 lead records required.", 555, 500, "LOW");
        issue("Acceptance rule", "At least 18 valid leads must pass.", 1010, 500, "LOW");
        text("Ready to fund", 1530, 260, 34, "#43dc8b");
        wrap("Clear terms make the escrow enforceable instead of subjective.", 1530, 330, 260, 34, 24);
      }

      function sceneFund(p) {
        clear();
        appShell();
        text("3. Lock GEN in the DealGuard escrow contract", 555, 205, 34);
        input("Escrow", "0.020 GEN", 105, 295, 350);
        input("Worker wallet", "0x3db9...84ef9", 105, 410, 350);
        drawButton("Fund Escrow", 105, 890, 180, "#ffbd66", "#d07100");
        panel(555, 285, 860, 230, "rgba(36,210,186,0.1)", "rgba(36,210,186,0.36)");
        text("Onchain success", 585, 325, 22, "#43dc8b", 950);
        text("Escrow funded on Bradbury", 585, 365, 42);
        pill("Open explorer 0xd8fe...e517", 585, 445, 350, "#24d2ba", "rgba(36,210,186,0.12)");
        metric("Locked", "0.020 GEN", 560);
        metric("Release", "Pending", 664);
        metric("Refund", "Pending", 768);
        wrap("Funds are not sent to the worker yet. They stay locked until the evidence based resolver writes a verdict.", 555, 560, 820, 36, 26);
      }

      function sceneResolve(p) {
        clear();
        appShell();
        text("4. Add delivery evidence, then resolve payout", 555, 205, 34);
        input("Evidence", "Only 6 of 20 leads delivered. 4 missing source URLs. 3 duplicates. 5 emails bounced.", 105, 295, 350, 250);
        drawButton("Resolve Onchain", 105, 890, 215, "#91a7ff", "#475bd3");
        panel(555, 285, 860, 230, "rgba(255,103,95,0.11)", "rgba(255,103,95,0.4)");
        text("Refund candidate", 585, 325, 22, "#ff675f", 950);
        text("Wallet writes the verdict", 585, 365, 42);
        wrap("Bad evidence is valid input. It tells DealGuard to return funds instead of releasing payment.", 585, 440, 760, 34, 25);
        metric("Release", "0 GEN", 560);
        metric("Refund", "0.020 GEN", 664);
        metric("Confidence", "93%", 768);
      }

      function sceneProof(p) {
        clear();
        appShell();
        text("5. Final state is visible and verifiable", 555, 205, 34);
        panel(555, 285, 860, 230, "rgba(67,220,139,0.1)", "rgba(67,220,139,0.38)");
        text("Verdict accepted on Bradbury", 585, 325, 42);
        text("Refund client", 585, 390, 36, "#ff675f");
        pill("Open explorer 0xresolve...tx", 585, 455, 330, "#24d2ba", "rgba(36,210,186,0.12)");
        metric("Funding", "Settled", 545);
        metric("Resolver", "Resolved", 650);
        metric("Last tx", "0xresolve...tx", 755);
        wrap(`Contract: ${contractAddress}`, 555, 575, 820, 34, 24);
        wrap(`Deploy tx: ${deployTx}`, 555, 650, 820, 34, 24);
      }

      function sceneClose(p) {
        clear();
        text("DealGuard", 120, 150, 92);
        wrap("Escrow infrastructure for agent to agent work.", 126, 270, 980, 56, 42, "#fff7e8", 850);
        wrap("Agreement risk before funding. Evidence based settlement after delivery. Real GenLayer Bradbury transactions.", 126, 450, 1080, 44, 30);
        panel(126, 700, 1180, 185, "rgba(0,0,0,0.42)", "rgba(36,210,186,0.34)");
        text("Live demo", 170, 735, 30, "#24d2ba");
        text(liveDemoUrl, 170, 790, 40);
        text("Built for GenLayer Agent Tank", 170, 855, 25, "#ffab31", 950);
      }

      function render(time) {
        const scene = sceneAt(time);
        const p = sceneProgress(scene, time);
        if (scene.kind === "title") sceneTitle(p);
        if (scene.kind === "riskHigh") sceneRiskHigh(p);
        if (scene.kind === "riskLow") sceneRiskLow(p);
        if (scene.kind === "fund") sceneFund(p);
        if (scene.kind === "resolve") sceneResolve(p);
        if (scene.kind === "proof") sceneProof(p);
        if (scene.kind === "close") sceneClose(p);
        const progress = time / duration;
        ctx.fillStyle = "rgba(255,247,232,0.16)";
        ctx.fillRect(120, 1015, 1680, 8);
        ctx.fillStyle = "#24d2ba";
        ctx.fillRect(120, 1015, 1680 * progress, 8);
      }

      function preview() {
        const started = performance.now();
        function frame(now) {
          const time = ((now - started) / 1000) % duration;
          render(time);
          requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      async function record() {
        const voiceover = new Audio(voiceoverUrl);
        voiceover.preload = "auto";
        await new Promise((resolve) => {
          voiceover.addEventListener("loadedmetadata", resolve, { once: true });
          voiceover.load();
        });
        const audioDuration = Number.isFinite(voiceover.duration) ? voiceover.duration : 0;
        duration = Math.max(78, Math.ceil(audioDuration) + 1);

        const stream = canvas.captureStream(fps);
        const audioStream = voiceover.captureStream?.() || voiceover.mozCaptureStream?.();
        if (audioStream) {
          for (const track of audioStream.getAudioTracks()) {
            stream.addTrack(track);
          }
        }
        const chunks = [];
        const options = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
          ? { mimeType: "video/webm;codecs=vp9" }
          : { mimeType: "video/webm" };
        const recorder = new MediaRecorder(stream, options);
        recorder.ondataavailable = (event) => {
          if (event.data.size) chunks.push(event.data);
        };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: options.mimeType });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "dealguard-demo.webm";
          link.click();
          setTimeout(() => URL.revokeObjectURL(url), 30000);
          statusEl.textContent = "Done. Downloaded dealguard-demo.webm.";
        };

        statusEl.textContent = "Recording... keep this tab open for 78 seconds.";
        recorder.start();
        const started = performance.now();
        await voiceover.play();

        function frame(now) {
          const time = Math.min(duration, (now - started) / 1000);
          render(time);
          statusEl.textContent = `Recording... ${Math.round(time)} / ${duration}s`;
          if (time < duration) {
            requestAnimationFrame(frame);
          } else {
            recorder.stop();
          }
        }
        requestAnimationFrame(frame);
      }

      document.querySelector("#preview").addEventListener("click", preview);
      document.querySelector("#record").addEventListener("click", record);
      render(0);
    </script>
  </body>
</html>
